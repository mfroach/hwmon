<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Monitor</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
header h1{font-size:1.5rem;font-weight:600}
.status{font-size:.8rem;color:var(--dim);display:flex;align-items:center;gap:8px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:16px;font-weight:600}
.cpu-total{font-size:2.5rem;font-weight:700;line-height:1}
.cpu-bar{height:8px;background:#21262d;border-radius:4px;margin:12px 0;overflow:hidden}
.cpu-fill{height:100%;border-radius:4px;transition:width .5s ease}
.cpu-cores{display:flex;flex-wrap:wrap;gap:6px}
.core{font-size:.7rem;background:#21262d;padding:2px 6px;border-radius:4px;min-width:52px;text-align:center}
.sensor-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.sensor-row:last-child{border:none}
.sensor-label{font-size:.85rem;flex:1;min-width:0}
.sensor-val{font-size:.85rem;font-weight:600;margin-left:12px;white-space:nowrap}
.device-name{font-size:.9rem;font-weight:600;margin:12px 0 4px;color:var(--blue)}
.device-name:first-child{margin-top:0}
.temp-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.85rem;font-weight:600;margin:3px}
.temp-low{background:rgba(63,185,80,.15);color:var(--green)}
.temp-med{background:rgba(210,153,34,.15);color:var(--yellow)}
.temp-high{background:rgba(248,81,73,.15);color:var(--red)}
.empty{text-align:center;color:var(--dim);padding:32px;font-size:.9rem}
.timestamp{font-size:.75rem;color:var(--dim);text-align:right;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>Hardware Monitor</h1>
  <div class="status"><span class="dot"></span><span id="statusText">Connecting...</span></div>
</header>
<div class="grid" id="dashboard">
  <div class="card" id="cpuCard">
    <div class="card-title">CPU Usage</div>
    <div id="cpuContent" class="empty">Loading...</div>
  </div>
  <div class="card">
    <div class="card-title">Temperatures</div>
    <div id="tempContent" class="empty">Loading...</div>
  </div>
  <div class="card" id="gpuCard" style="display:none">
    <div class="card-title">GPU</div>
    <div id="gpuContent" class="empty">Loading...</div>
  </div>
  <div class="card">
    <div class="card-title">Thermal Zones</div>
    <div id="thermalContent" class="empty">Loading...</div>
  </div>
</div>
<div class="timestamp" id="lastUpdate"></div>

<script>
const API='http://localhost:9899/api';
function tempClass(t){if(t==null)return'';if(t<60)return'temp-low';if(t<80)return'temp-med';return'temp-high'}
function cpuColor(p){if(p<60)return'var(--green)';if(p<85)return'var(--yellow)';return'var(--red)'}
function cpuFill(p){const c=document.getElementById('cpuFill');c.style.width=p+'%';c.style.background=cpuColor(p)}
function renderCPU(d){
  const el=document.getElementById('cpuContent');
  let cores=d.cores.map((v,i)=>`<span class="core" style="color:${cpuColor(v)}">C${i}:${v.toFixed(0)}%</span>`).join('');
  el.innerHTML=`<div class="cpu-total" style="color:${cpuColor(d.total_percent)}">${d.total_percent.toFixed(1)}%</div><div class="cpu-bar"><div class="cpu-fill" id="cpuFill" style="width:${d.total_percent}%"></div></div><div class="cpu-cores">${cores}</div>`;
}
function renderTemps(d){
  const el=document.getElementById('tempContent');
  let html='';
  d.hwmon.forEach(dev=>{
    dev.temperatures.forEach(t=>{
      const cls=tempClass(t.value);
      const display=`${t.label||''} ${t.value.toFixed(1)}°C`.trim();
      html+=`<div class="device-name">${dev.name}</div><div class="temp-badge ${cls}">${display}</div>`;
    });
  });
  d.thermal_zones.forEach(z=>{
    html+=`<div class="device-name">${z.name}</div><div class="temp-badge ${tempClass(z.temp)}">${z.type_} ${z.temp.toFixed(1)}°C</div>`;
  });
  if(!html)html='<div class="empty">No temperature sensors</div>';
  el.innerHTML=html;
}
function renderGPU(d){
  const card=document.getElementById('gpuCard');
  const el=document.getElementById('gpuContent');
  if(!d||!d.length){card.style.display='none';return}
  card.style.display='';
  let html='';
  d.forEach(g=>{
    html+=`<div class="device-name">${g.name||'GPU'}</div>`;
    if(g.temperature!=null)html+=`<div class="sensor-row"><span class="sensor-label">Temperature</span><span class="sensor-val">${g.temperature}°C</span></div>`;
    if(g.power_draw_watts!=null)html+=`<div class="sensor-row"><span class="sensor-label">Power</span><span class="sensor-val">${g.power_draw_watts.toFixed(1)}W</span></div>`;
    if(g.utilization_gpu!=null)html+=`<div class="sensor-row"><span class="sensor-label">GPU Util</span><span class="sensor-val">${g.utilization_gpu}%</span></div>`;
    if(g.utilization_memory!=null)html+=`<div class="sensor-row"><span class="sensor-label">Mem Util</span><span class="sensor-val">${g.utilization_memory}%</span></div>`;
    if(g.memory_used_mb!=null)html+=`<div class="sensor-row"><span class="sensor-label">VRAM</span><span class="sensor-val">${g.memory_used_mb.toFixed(0)}/${g.memory_total_mb.toFixed(0)} MB</span></div>`;
    if(g.fan_speed_percent!=null)html+=`<div class="sensor-row"><span class="sensor-label">Fan</span><span class="sensor-val">${g.fan_speed_percent}%</span></div>`;
    html+=`<div class="sensor-row"><span class="sensor-label">PCI</span><span class="sensor-val">${g.pci_bus_id||'n/a'}</span></div>`;
  });
  el.innerHTML=html;
}
async function poll(){
  try{
    const r=await fetch(API);
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    document.getElementById('statusText').textContent='Connected';
    renderCPU(d.cpu_usage);
    renderTemps(d);
    renderGPU(d.gpu);
    const el=document.getElementById('thermalContent');
    if(!d.thermal_zones.length){el.innerHTML='<div class="empty">No thermal zones</div>'}
    else{el.innerHTML=d.thermal_zones.map(z=>`<div class="device-name">${z.name}</div><div class="temp-badge ${tempClass(z.temp)}">${z.type_} ${z.temp.toFixed(1)}°C</div>`).join('')}
    document.getElementById('lastUpdate').textContent='Updated: '+new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('statusText').textContent='Error: '+e.message;
    document.getElementById('cpuContent').textContent='Failed to load';
    document.getElementById('tempContent').textContent='Failed to load';
    document.getElementById('thermalContent').textContent='Failed to load';
  }
}
setInterval(poll,2000);poll();
</script>
</body>
</html>
